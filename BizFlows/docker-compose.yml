services:
  postgres:
    image: postgres:17
    container_name: bizflows-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bizflows
      POSTGRES_USER: bizflows
      POSTGRES_PASSWORD: bizflows_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizflows -d bizflows"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: